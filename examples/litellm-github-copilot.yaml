# Puts this repository's bridge (src/server.mjs) behind LiteLLM.
# Start the bridge first and export both variables, because os.environ/ is
# resolved when LiteLLM loads this file:
#   node src/bridge-daemon.mjs ensure claude-sonnet-5 4142
#   export GHCP_BRIDGE_URL="http://127.0.0.1:4142"
#   export GHCP_BRIDGE_TOKEN="<token from the ensure output>"
#
# api_base must be the bridge root: LiteLLM appends /v1/messages itself.
# The string after anthropic/ is sent as the request body's model.

model_list:
  - model_name: claude-opus-5.5
    litellm_params:
      model: anthropic/claude-opus-5.5
      api_base: os.environ/GHCP_BRIDGE_URL
      api_key: os.environ/GHCP_BRIDGE_TOKEN

  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_base: os.environ/GHCP_BRIDGE_URL
      api_key: os.environ/GHCP_BRIDGE_TOKEN

  # LiteLLM does no suffix stripping, so an alias carrying [1m] is rejected
  # upstream with 400 "Invalid model name" -- LiteLLM's own behaviour, which this
  # repository does not verify. Keep the alias plain and put the suffix after
  # anthropic/, where the bridge strips it (stripContextSuffix in src/model-map.mjs).
  - model_name: claude-sonnet-5-1m
    litellm_params:
      model: anthropic/claude-sonnet-5[1m]
      api_base: os.environ/GHCP_BRIDGE_URL
      api_key: os.environ/GHCP_BRIDGE_TOKEN

  - model_name: claude-haiku-4.5
    litellm_params:
      model: anthropic/claude-haiku-4.5
      api_base: os.environ/GHCP_BRIDGE_URL
      api_key: os.environ/GHCP_BRIDGE_TOKEN

  - model_name: gpt-6-astra
    litellm_params:
      model: anthropic/gpt-6-astra
      api_base: os.environ/GHCP_BRIDGE_URL
      api_key: os.environ/GHCP_BRIDGE_TOKEN

  - model_name: gpt-6-sol
    litellm_params:
      model: anthropic/gpt-6-sol
      api_base: os.environ/GHCP_BRIDGE_URL
      api_key: os.environ/GHCP_BRIDGE_TOKEN

  - model_name: gpt-6-luna
    litellm_params:
      model: anthropic/gpt-6-luna
      api_base: os.environ/GHCP_BRIDGE_URL
      api_key: os.environ/GHCP_BRIDGE_TOKEN

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Required so x-claude-code-session-id and x-claude-code-agent-id reach the
  # bridge; without them every caller collapses into one session family. It does
  # not forward a client's x-api-key. Leave forward_llm_provider_auth_headers
  # unset: that separate setting does, and it overrides the api_key above.
  forward_client_headers_to_llm_api: true
